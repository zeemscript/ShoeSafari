name: Storage rules

on:
  pull_request:
    paths:
      - "storage.rules"
      - "firebase.storage.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-rules.yml"
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "firebase.storage.json"
      - "tests/rules/**"
      - "vitest.rules.config.js"
      - "vitest.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storage-rules.yml"

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:rules:storage
